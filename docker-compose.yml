services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: bookings
      POSTGRES_PASSWORD: bookings
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first start of an empty volume (docker compose down -v to re-run).
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookings -d bookings"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./BookingsApi
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: Host=db;Port=5432;Database=bookings;Username=bookings;Password=bookings
      Jwt__Key: dev-only-secret-change-me-at-least-32-chars-long
    ports:
      - "5129:8080"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: ./booking-ui
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
